name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Build & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Determine release tag
        id: tag-info
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Validate before writing to GITHUB_OUTPUT to prevent output injection.
          SEMVER_REGEX="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$"
          if [[ ! "$RAW_TAG" =~ $SEMVER_REGEX ]]; then
            echo "Error: Invalid semantic version release tag." >&2
            exit 1
          fi
          echo "Resolved release tag: $RAW_TAG"
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate semantic version tag format
        env:
          TAG: ${{ steps.tag-info.outputs.tag }}
        run: |
          SEMVER_REGEX="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$"
          if [[ ! "$TAG" =~ $SEMVER_REGEX ]]; then
            echo "Error: Tag '$TAG' does not conform to Semantic Versioning (expected format: vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD])" >&2
            exit 1
          fi
          echo "Tag '$TAG' is a valid Semantic Version."

      - name: Checkout tagged commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ steps.tag-info.outputs.tag }}
          fetch-depth: 0

      - name: Prevent accidental overwriting of existing release
        env:
          TAG: ${{ steps.tag-info.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Error: A GitHub Release for tag '$TAG' already exists. Aborting to prevent accidental overwrite." >&2
            exit 1
          fi
          echo "No existing release found for '$TAG'. Safe to proceed."

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Validate package version against git tag
        env:
          TAG: ${{ steps.tag-info.outputs.tag }}
        run: |
          TAG_VERSION="${TAG#v}"
          echo "Validating package metadata against tag version: $TAG_VERSION"

          PKG_VERSION=""
          if [ -f "pyproject.toml" ]; then
            PKG_VERSION=$(python3 -c "
          import tomllib
          try:
              with open('pyproject.toml', 'rb') as f:
                  data = tomllib.load(f)
              print(data.get('project', {}).get('version', '') or data.get('tool', {}).get('poetry', {}).get('version', ''))
          except Exception:
              pass
          " 2>/dev/null || true)
          fi

          if [ -z "$PKG_VERSION" ] && [ -f "setup.cfg" ]; then
            PKG_VERSION=$(python3 -c "
          import configparser
          try:
              cp = configparser.ConfigParser()
              cp.read('setup.cfg')
              print(cp.get('metadata', 'version', fallback=''))
          except Exception:
              pass
          " 2>/dev/null || true)
          fi

          if [ -n "$PKG_VERSION" ]; then
            echo "Declared package version: '$PKG_VERSION'"
            echo "Git tag stripped version: '$TAG_VERSION'"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "Error: Tag version '$TAG_VERSION' does not match declared package version '$PKG_VERSION'!" >&2
              exit 1
            else
              echo "Package version matches git tag version."
            fi
          else
            echo "No static package version metadata found. Skipping package version alignment check."
          fi

      - name: Build Python distribution packages
        run: |
          mkdir -p dist
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "setup.cfg" ]; then
            echo "Packaging configuration detected. Building source distribution and wheel..."
            python -m pip install --upgrade pip build
            python -m build --outdir dist/
            echo "Build successful. Generated artifacts:"
            ls -la dist/
          else
            echo "No packaging configuration found (pyproject.toml/setup.py/setup.cfg). Skipping distribution package build."
          fi

      - name: Generate SHA256 checksums
        run: |
          if compgen -G "dist/*" > /dev/null; then
            echo "Generating SHA256 checksums for distribution artifacts..."
            (
              cd dist
              sha256sum * > SHA256SUMS.txt
              echo "Generated SHA256SUMS.txt:"
              cat SHA256SUMS.txt
            )
          else
            echo "No distribution artifacts found. Skipping SHA256 checksum generation."
          fi

      - name: Publish GitHub Release
        env:
          TAG: ${{ steps.tag-info.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "Preparing GitHub Release for $TAG..."

          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            echo "Tag contains prerelease identifier; setting --prerelease flag."
            PRERELEASE_FLAG="--prerelease"
          fi

          RELEASE_ARGS=(
            "$TAG"
            --title "Release $TAG"
            --generate-notes
          )

          if [ -n "$PRERELEASE_FLAG" ]; then
            RELEASE_ARGS+=("$PRERELEASE_FLAG")
          fi

          if compgen -G "dist/*" > /dev/null; then
            echo "Attaching distribution artifacts to release:"
            for artifact in dist/*; do
              if [ -f "$artifact" ]; then
                echo "  - $artifact"
                RELEASE_ARGS+=("$artifact")
              fi
            done
          fi

          echo "Publishing release via GitHub CLI..."
          gh release create "${RELEASE_ARGS[@]}"
          echo "Successfully published GitHub Release $TAG."
