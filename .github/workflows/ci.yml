name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Build (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Detect project configuration
        id: config
        run: |
          has_deps=false
          if [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || [ -f "requirements-dev.txt" ] || compgen -G "requirements/*.txt" > /dev/null; then
            has_deps=true
          fi
          echo "has_deps=$has_deps" >> "$GITHUB_OUTPUT"

          has_code=false
          if find . -name "*.py" -not -path "*/.*" -not -path "./venv/*" -not -path "./.venv/*" | grep -q .; then
            has_code=true
          fi
          echo "has_code=$has_code" >> "$GITHUB_OUTPUT"

          has_tests=false
          if [ -d "tests" ] || [ -d "test" ] || find . -maxdepth 3 \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            has_tests=true
          fi
          echo "has_tests=$has_tests" >> "$GITHUB_OUTPUT"

          has_ruff=false
          if [ -f "ruff.toml" ] || [ -f ".ruff.toml" ] || ( [ -f "pyproject.toml" ] && grep -q "\[tool\.ruff" pyproject.toml 2>/dev/null ); then
            has_ruff=true
          fi
          echo "has_ruff=$has_ruff" >> "$GITHUB_OUTPUT"

          has_package_config=false
          if [ -f "pyproject.toml" ]; then
            has_package_config=true
          fi
          echo "has_package_config=$has_package_config" >> "$GITHUB_OUTPUT"

          echo "Detected project state:"
          echo "  - Dependencies present: $has_deps"
          echo "  - Python code present:  $has_code"
          echo "  - Tests present:        $has_tests"
          echo "  - Ruff configured:      $has_ruff"
          echo "  - Package buildable:    $has_package_config"

      - name: Cache pip dependencies
        if: steps.config.outputs.has_deps == 'true'
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml', '**/requirements*.txt', 'requirements/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        env:
          HAS_DEPS: ${{ steps.config.outputs.has_deps }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ "$HAS_DEPS" = "true" ]; then
            if [ -f "pyproject.toml" ]; then
              echo "Installing package from pyproject.toml..."
              if pip install -e ".[dev,test]" 2>/dev/null; then
                echo "Successfully installed package with dev/test extras."
              elif pip install -e . 2>/dev/null; then
                echo "Successfully installed package in editable mode."
              else
                pip install .
              fi
            elif [ -f "requirements.txt" ]; then
              echo "Installing dependencies from requirements.txt..."
              pip install -r requirements.txt
              if [ -f "requirements-dev.txt" ]; then
                echo "Installing dependencies from requirements-dev.txt..."
                pip install -r requirements-dev.txt
              fi
            fi
          else
            echo "No dependency definitions found (pyproject.toml or requirements.txt). Skipping dependency installation."
          fi

      - name: Check Python compilation syntax
        env:
          HAS_CODE: ${{ steps.config.outputs.has_code }}
        run: |
          if [ "$HAS_CODE" = "true" ]; then
            echo "Compiling Python source files across repository..."
            python -m compileall -q .
            echo "Python syntax compilation check passed."
          else
            echo "No Python source files found. Skipping compilation check."
          fi

      - name: Check code formatting and linting (Ruff)
        env:
          HAS_RUFF: ${{ steps.config.outputs.has_ruff }}
        run: |
          if [ "$HAS_RUFF" = "true" ]; then
            echo "Ruff configuration detected; installing ruff..."
            pip install ruff
            echo "Running Ruff linter..."
            ruff check .
            echo "Running Ruff formatter check..."
            ruff format --check .
          else
            echo "Ruff is not configured. Skipping Ruff checks."
          fi

      - name: Run test suite with coverage
        env:
          HAS_TESTS: ${{ steps.config.outputs.has_tests }}
        run: |
          if [ "$HAS_TESTS" = "true" ]; then
            echo "Test suite detected. Ensuring pytest is installed..."
            if ! command -v pytest >/dev/null 2>&1; then
              pip install pytest
            fi
            if python -c "import pytest_cov" 2>/dev/null; then
              echo "pytest-cov detected; running pytest with coverage reporting..."
              pytest --cov --cov-report=term-missing --cov-report=xml
            else
              echo "pytest-cov not available; running pytest..."
              pytest
            fi
          else
            echo "No test files or directories detected (e.g., tests/, test_*.py). Skipping pytest execution."
          fi

      - name: Validate package build
        env:
          HAS_PACKAGE_CONFIG: ${{ steps.config.outputs.has_package_config }}
        run: |
          if [ "$HAS_PACKAGE_CONFIG" = "true" ]; then
            echo "pyproject.toml detected. Validating package build..."
            python -m pip install --upgrade build
            python -m build
            echo "Package build validation passed successfully."
          else
            echo "No pyproject.toml found. Skipping package build validation."
          fi

      - name: Report CI summary
        if: always()
        run: |
          {
            echo "### CI Summary for Python ${{ matrix.python-version }}"
            echo ""
            echo "| Check | Status |"
            echo "| :--- | :--- |"
            echo "| Dependencies Installed | ${{ steps.config.outputs.has_deps == 'true' && '✅ Executed' || '⏭️ Skipped (no manifests)' }} |"
            echo "| Compilation Check | ${{ steps.config.outputs.has_code == 'true' && '✅ Executed' || '⏭️ Skipped (no source)' }} |"
            echo "| Ruff Lint / Format | ${{ steps.config.outputs.has_ruff == 'true' && '✅ Executed' || '⏭️ Skipped (not configured)' }} |"
            echo "| Pytest Test Suite | ${{ steps.config.outputs.has_tests == 'true' && '✅ Executed' || '⏭️ Skipped (no tests)' }} |"
            echo "| Package Build | ${{ steps.config.outputs.has_package_config == 'true' && '✅ Executed' || '⏭️ Skipped (no pyproject.toml)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
