name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1" # Weekly every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-security:
    name: GitHub Actions Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Run Zizmor workflow security analysis
        run: |
          echo "Installing zizmor security audit tool..."
          python -m pip install --upgrade pip zizmor
          echo "Scanning GitHub Actions workflow definitions..."
          zizmor .

  dependency-audit:
    name: Dependency Vulnerability Audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Audit dependencies for known vulnerabilities
        run: |
          has_deps=false
          if [ -f "pyproject.toml" ]; then
            has_deps=true
          fi
          if compgen -G "*requirements*.txt" > /dev/null || compgen -G "requirements/*.txt" > /dev/null; then
            has_deps=true
          fi

          if [ "$has_deps" = "true" ]; then
            echo "Dependency manifests detected. Installing pip-audit..."
            python -m pip install --upgrade pip pip-audit
            if [ -f "pyproject.toml" ]; then
              echo "Auditing dependencies in pyproject.toml..."
              pip-audit .
            fi
            for req in *requirements*.txt requirements/*.txt; do
              if [ -f "$req" ]; then
                echo "Auditing dependencies in $req..."
                pip-audit -r "$req"
              fi
            done
            echo "pip-audit completed successfully."
          else
            echo "No dependency manifests (pyproject.toml or requirements*.txt) found. Skipping pip-audit."
          fi

  detect-python-code:
    name: Detect Python Source Files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      has_code: ${{ steps.check.outputs.has_code }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check for Python source code
        id: check
        run: |
          if find . -name "*.py" -not -path "*/.*" -not -path "./venv/*" -not -path "./.venv/*" | grep -q .; then
            echo "Python source code found in repository."
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Python source code found in repository."
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

  codeql:
    name: CodeQL Python Analysis
    needs: detect-python-code
    if: needs.detect-python-code.outputs.has_code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
